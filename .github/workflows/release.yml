name: Release

# Build Chrome + Firefox packages and attach both zips to a GitHub Release
# whenever a version tag (v*) is pushed. Tests run separately via test.yml on
# every push to main and every PR; a release tag only publishes artifacts.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the Release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Build packages (also regenerates scripts/background-bundle.js and
      # runs npm ci implicitly via the cache, but install first).
      - run: npm ci

      - name: Test
        run: npm test

      - name: Build Chrome + Firefox packages
        run: npm run build

      # softprops/action-gh-release creates the Release for the tag if it does
      # not exist and attaches every file in `files`.
      # Pinned to v2.6.2 (commit 3bb12739c298aeb8a4eeaf626c5b8d85266b0e65).
      - name: Publish release with zips
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            dist/lodvault-v*-chrome.zip
            dist/lodvault-v*-firefox.zip
