name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Build the Firefox package and run Mozilla's web-ext lint (AMO
      # validation). Fails on errors; surfaces warnings non-fatally so the
      # pre-existing escaped-innerHTML / data-collection notices don't block.
      - name: Build + web-ext lint (Firefox/AMO)
        run: npm run lint
