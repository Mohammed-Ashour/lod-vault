name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Background bundle is up to date
        run: |
          npm run build:background
          git diff --exit-code -- scripts/background-bundle.js || {
            echo "::error::scripts/background-bundle.js is stale. Run npm run build:background and commit it."
            exit 1
          }

      - run: npm test

      - run: npm run lint
