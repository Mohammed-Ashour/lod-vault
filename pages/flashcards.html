<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LODVault Flashcards</title>
  <link rel="stylesheet" href="../styles/flashcards.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">LODVault</p>
        <h1>Flashcards</h1>
        <p id="deck-status" class="muted" aria-live="polite">Loading deck…</p>
      </div>
      <div class="controls">
        <button id="open-preview" class="secondary-button" title="Open Export Vault">Vault</button>
        <label class="control-group">
          <span>Deck</span>
          <select id="deck-filter">
            <option value="study">Study list</option>
            <option value="favorites">Favorites</option>
            <option value="all">All saved</option>
          </select>
        </label>
        <label class="control-group">
          <span>Order</span>
          <select id="order-mode">
            <option value="smart">Smart</option>
            <option value="shuffle">Shuffle</option>
            <option value="sequential">Sequential</option>
          </select>
        </label>
        <label class="control-group">
          <span>Session</span>
          <select id="session-size">
            <option value="all">All</option>
            <option value="10">10 cards</option>
            <option value="20">20 cards</option>
          </select>
        </label>
        <button id="direction-toggle" class="secondary-button" title="Toggle reverse cards (R)">Lux → EN</button>
      </div>
    </header>

    <div class="stats-bar">
      <div class="stat">
        <span class="stat-icon">🔥</span>
        <span class="stat-value" id="stat-streak">0</span>
        <span class="stat-label">day streak</span>
      </div>
      <div class="stat">
        <span class="stat-icon">📚</span>
        <span class="stat-value" id="stat-today">0</span>
        <span class="stat-label">today</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-new">0</span>
        <span class="stat-label">new</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-learning">0</span>
        <span class="stat-label">learning</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-mastered">0</span>
        <span class="stat-label">mastered</span>
      </div>
    </div>

    <section id="empty-state" class="empty-state is-hidden">
      No words available for this flashcard deck yet.
    </section>

    <section id="card-shell" class="card-shell is-hidden">
      <div id="progress" class="progress" aria-live="polite">1 / 1</div>
      <div id="session-progress" class="session-progress is-hidden" aria-live="polite">Session: 0 / 0</div>
      <button id="flashcard" class="flashcard" type="button" role="button" aria-label="Flashcard — click to reveal answer">
        <div class="card-face card-front">
          <span class="face-label">Front</span>
          <h2 id="card-word">Word</h2>
          <p id="card-type" class="muted"></p>
          <p class="hint">Click Reveal to show the answer.</p>
        </div>
        <div class="card-face card-back">
          <span class="face-label">Back</span>
          <div id="card-answer" class="answer"></div>
        </div>
      </button>

      <div class="actions">
        <button id="prev-card" class="nav-button secondary-button secondary-button-light">← Prev</button>
        <button id="flip-card" class="nav-button secondary-button">Reveal</button>
        <button id="next-card" class="nav-button secondary-button secondary-button-light">Next →</button>
      </div>

      <div id="rating-bar" class="rating-bar is-hidden">
        <button class="rating-button rating-hard" data-rating="1" title="Hard (1)">Hard</button>
        <button class="rating-button rating-good" data-rating="2" title="Good (2)">Good</button>
        <button class="rating-button rating-easy" data-rating="3" title="Easy (3)">Easy</button>
      </div>
    </section>

    <section id="summary-overlay" class="summary-overlay is-hidden">
      <div class="summary-card">
        <h2>Session Complete</h2>
        <div class="summary-stats">
          <div class="summary-stat">
            <span class="summary-number" id="summary-total">0</span>
            <span class="summary-label">cards</span>
          </div>
          <div class="summary-stat">
            <span class="summary-number summary-hard" id="summary-hard">0</span>
            <span class="summary-label">hard</span>
          </div>
          <div class="summary-stat">
            <span class="summary-number summary-good" id="summary-good">0</span>
            <span class="summary-label">good</span>
          </div>
          <div class="summary-stat">
            <span class="summary-number summary-easy" id="summary-easy">0</span>
            <span class="summary-label">easy</span>
          </div>
        </div>
        <button id="close-summary" class="secondary-button">Continue Studying</button>
      </div>
    </section>
  </main>

  <script src="../scripts/store-core.js"></script>
  <script src="../scripts/entry-presenter.js"></script>
  <script src="../scripts/shared.js"></script>
  <script src="../scripts/flashcards.js"></script>
</body>
</html>
