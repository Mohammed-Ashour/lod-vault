<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restore JSON — LODVault</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --card: #171a21;
      --card-2: #1f232c;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e7eaf0;
      --muted: #9aa3b2;
      --accent: #4c8dff;
      --ok: #34d399;
      --err: #f87171;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --card-2: #f0f2f5;
        --border: rgba(0, 0, 0, 0.1);
        --text: #1a1d23;
        --muted: #5b6573;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
    }
    h1 { font-size: 18px; margin: 0 0 6px; }
    p.lead { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
    .file-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    input[type="file"] {
      flex: 1 1 auto;
      font: inherit;
      color: var(--text);
    }
    .btn {
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 14px;
      font: inherit;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .status {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      min-height: 20px;
      color: var(--muted);
    }
    .status.is-ok { color: var(--ok); border-color: rgba(52, 211, 153, 0.4); }
    .status.is-err { color: var(--err); border-color: rgba(248, 113, 113, 0.4); }
    .status.is-busy { color: var(--accent); }
    .done-row { margin-top: 18px; display: flex; justify-content: flex-end; }
    .dropzone {
      margin-top: 14px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      transition: border-color 0.15s, background 0.15s;
    }
    .dropzone.is-over { border-color: var(--accent); background: var(--card-2); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Restore JSON backup</h1>
    <p class="lead">Choose a LODVault export (.json) to merge it into your vault.</p>

    <div class="file-row">
      <input type="file" id="file-input" accept="application/json,.json" aria-label="Choose a LODVault JSON export">
    </div>

    <div class="dropzone" id="dropzone">…or drag and drop the file here</div>

    <p class="status" id="status" aria-live="polite">Waiting for a file.</p>

    <div class="done-row">
      <button type="button" class="btn" id="done">Done</button>
    </div>
  </main>

  <script src="../scripts/store-core.js"></script>
  <script src="../scripts/shared.js"></script>
  <script src="../scripts/import.js"></script>
</body>
</html>
