<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LODVault Vault</title>
  <link rel="stylesheet" href="../styles/preview.css">
</head>
<body>
  <header class="toolbar">
    <div>
      <p class="eyebrow">LODVault</p>
      <h1>Export vault</h1>
      <p id="preview-meta" class="meta">Loading…</p>
    </div>
    <div class="toolbar-actions">
      <select id="sort-order" class="sort-select">
        <option value="recent">Most recent</option>
        <option value="visited">Most visited</option>
        <option value="alpha">A → Z</option>
        <option value="oldest">Oldest first</option>
      </select>
      <select id="lang-filter" class="lang-select"><option value="">All languages</option></select>
      <button id="open-flashcards" class="toolbar-button" title="Open Flashcards">Flashcards</button>
      <button id="refresh-preview" class="toolbar-button">Refresh</button>
      <button id="download-html" class="toolbar-button toolbar-button-primary">Download HTML</button>
      <button id="download-anki" class="toolbar-button">Download Anki</button>
    </div>
  </header>

  <main class="preview-shell">
    <iframe id="preview-frame" title="LODVault export vault"></iframe>
  </main>

  <script src="../scripts/store-core.js"></script>
  <script src="../scripts/note-autosave.js"></script>
  <script src="../scripts/entry-presenter.js"></script>
  <script src="../scripts/shared.js"></script>
  <script src="../scripts/preview.js"></script>
</body>
</html>
