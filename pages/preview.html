<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LODVault Vault</title>
  <script>try { if (localStorage.getItem("blueNightTheme") === "light") document.documentElement.classList.add("light"); } catch (e) {}</script>
  <link rel="stylesheet" href="../styles/blue-night.css">
  <link rel="stylesheet" href="../styles/preview.css">
</head>
<body>
  <header class="appbar">
    <div class="title-lockup">
      <div class="wordmark"><b>LOD</b>Vault</div>
      <h1 class="page-title">Vault</h1>
    </div>
    <p id="preview-meta" class="status">Loading…</p>
    <div class="toolbar">
      <button id="open-flashcards" class="text-link" title="Open Flashcards">Flashcards</button>
      <select id="sort-order" class="select" aria-label="Sort order">
        <option value="recent">Most recent</option>
        <option value="visited">Most visited</option>
        <option value="alpha">A → Z</option>
        <option value="oldest">Oldest first</option>
      </select>
      <select id="lang-filter" class="select" aria-label="Language filter"><option value="">All languages</option></select>
      <button id="refresh-preview" class="icon-btn" title="Refresh" aria-label="Refresh">↻</button>
      <button type="button" class="icon-btn theme-btn" onclick="toggleTheme()" aria-label="Switch to light">☀</button>
      <div class="menu-wrap">
        <button id="export-trigger" class="btn-primary" type="button">Export ▾</button>
        <div id="export-menu" class="menu">
          <button id="download-html" type="button">Download HTML<small>Full vault, opens anywhere</small></button>
          <button id="download-anki" type="button">Download Anki<small>Tab-separated deck file</small></button>
        </div>
      </div>
    </div>
  </header>

  <main class="preview-shell">
    <iframe id="preview-frame" title="LODVault export vault"></iframe>
  </main>

  <p id="action-feedback" class="action-feedback is-hidden" role="status" aria-live="polite"></p>

  <div id="delete-undo" class="undo-toast is-hidden" role="status" aria-live="polite">
    <span id="delete-undo-message"></span>
    <button id="delete-undo-button" type="button">Undo</button>
  </div>

  <script src="../scripts/store-core.js"></script>
  <script src="../scripts/note-autosave.js"></script>
  <script src="../scripts/entry-presenter.js"></script>
  <script src="../scripts/shared.js"></script>
  <script src="../scripts/theme.js"></script>
  <script src="../scripts/preview.js"></script>
  <script>
    // Export menu toggle (grouped exports, one primary action)
    (function () {
      const trigger = document.getElementById("export-trigger");
      const menu = document.getElementById("export-menu");
      trigger.addEventListener("click", (event) => {
        event.stopPropagation();
        menu.classList.toggle("is-open");
      });
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".menu-wrap")) menu.classList.remove("is-open");
      });
      menu.addEventListener("click", () => menu.classList.remove("is-open"));
    })();

    // Mirror the page theme onto the vault document (generated export HTML)
    (function () {
      const frame = document.getElementById("preview-frame");
      function syncTheme() {
        const doc = frame.contentDocument;
        if (!doc) return;
        doc.documentElement.classList.toggle("light", document.documentElement.classList.contains("light"));
      }
      const observer = new MutationObserver(syncTheme);
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
      frame.addEventListener("load", syncTheme);
      syncTheme();
    })();
  </script>
</body>
</html>
